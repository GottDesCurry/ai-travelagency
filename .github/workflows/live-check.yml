name: Live check (manual)
# Runs only when started by hand. Uses API quota: at most 3 RapidAPI requests,
# plus 1 tiny OpenAI request when "openai" is ticked. Keys come from repository secrets.
on:
  workflow_dispatch:
    inputs:
      openai:
        description: 'Auch OpenAI prüfen (1 Mini-Abfrage)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: live-check
  cancel-in-progress: false
jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run live-check -- ${{ inputs.openai && '--openai' || '' }}
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DUFFEL_ACCESS_TOKEN: ${{ secrets.DUFFEL_ACCESS_TOKEN }}
          LITEAPI_KEY: ${{ secrets.LITEAPI_KEY }}
